name: Deploy SmartNet Bot to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          script: |
            cd ~/htdocs/api.fastdatabundles.co.ke/SMARTNET-BACKEND
            git pull origin main
            npm install
            pm2 restart smartnet-bot